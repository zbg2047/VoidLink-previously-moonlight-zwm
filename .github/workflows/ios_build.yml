name: Build iOS IPA

on:
  push:
    branches: [ "Integration" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find Project and Detect Scheme
        id: setup_build
        run: |
          # 1. 查找项目文件 (排除 .xcodeproj 内部文件)
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*.xcodeproj/*" -print -quit)
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ -n "$WORKSPACE" ]; then
            echo "✅ Found Workspace: $WORKSPACE"
            TARGET_PATH="$WORKSPACE"
            TARGET_FLAG="-workspace"
            WORK_DIR="$(dirname "$WORKSPACE")"
          elif [ -n "$PROJECT" ]; then
            echo "✅ Found Project: $PROJECT"
            TARGET_PATH="$PROJECT"
            TARGET_FLAG="-project"
            WORK_DIR="$(dirname "$PROJECT")"
          else
            echo "❌ Error: No Xcode project found!"
            exit 1
          fi

          # 2. 自动检测 Scheme
          cd "$WORK_DIR"
          TARGET_NAME=$(basename "$TARGET_PATH")
          
          echo "🔍 Listing schemes..."
          SCHEME=$(xcodebuild -list $TARGET_FLAG "$TARGET_NAME" | \
            awk '/Schemes:/{flag=1; next} flag && NF {print $0; exit}' | xargs)
          
          if [ -z "$SCHEME" ]; then
            echo "❌ Error: Could not detect any schemes!"
            xcodebuild -list $TARGET_FLAG "$TARGET_NAME"
            exit 1
          fi
          
          echo "✅ Detected Scheme: $SCHEME"
          
          echo "work_dir=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "target_name=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "target_flag=$TARGET_FLAG" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build App (Direct Build)
        run: |
          cd "${{ steps.setup_build.outputs.work_dir }}"
          
          echo "🚀 Building Scheme: ${{ steps.setup_build.outputs.scheme }} (Action: build)"
          
          # 使用 build 而不是 archive
          # 指定 -derivedDataPath 以便我们要知道输出文件在哪
          xcodebuild build \
            -scheme "${{ steps.setup_build.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            "${{ steps.setup_build.outputs.target_flag }}" "${{ steps.setup_build.outputs.target_name }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd "${{ steps.setup_build.outputs.work_dir }}"
          
          echo "🔍 Searching for .app in build_output..."
          
          # 构建产物通常在 Build/Products/Release-iphoneos/ 下
          APP_DIR=$(find build_output/Build/Products -type d -name "*.app" | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: .app directory not found in build output!"
            echo "Dumping build directory structure for debugging:"
            find build_output -maxdepth 4
            exit 1
          fi
          
          echo "✅ Found App at: $APP_DIR"
          
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          
          # 制作 IPA
          zip -r VoidLink.ipa Payload
          
          mv VoidLink.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: VoidLink.ipa
          retention-days: 5
