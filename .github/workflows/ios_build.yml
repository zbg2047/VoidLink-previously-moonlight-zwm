name: Build iOS IPA

on:
  push:
    branches: [ "Integration" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find Project and Detect Scheme
        id: setup_build
        run: |
          # 1. 查找项目文件 (优先 .xcworkspace)
          WORKSPACE=$(find . -name "*.xcworkspace" -print -quit)
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ -n "$WORKSPACE" ]; then
            echo "✅ Found Workspace: $WORKSPACE"
            TARGET_PATH="$WORKSPACE"
            TARGET_FLAG="-workspace"
            IS_WORKSPACE="true"
            WORK_DIR="$(dirname "$WORKSPACE")"
          elif [ -n "$PROJECT" ]; then
            echo "✅ Found Project: $PROJECT"
            TARGET_PATH="$PROJECT"
            TARGET_FLAG="-project"
            IS_WORKSPACE="false"
            WORK_DIR="$(dirname "$PROJECT")"
          else
            echo "❌ Error: No Xcode project found!"
            exit 1
          fi

          # 2. 自动检测 Scheme
          # 进入项目目录执行 list 命令
          cd "$WORK_DIR"
          TARGET_NAME=$(basename "$TARGET_PATH")
          
          echo "🔍 Listing schemes for $TARGET_NAME..."
          # 获取 schemes 列表，找到 "Schemes:" 下一行的第一个非空名称
          SCHEME=$(xcodebuild -list $TARGET_FLAG "$TARGET_NAME" | \
            awk '/Schemes:/{flag=1; next} flag && NF {print $0; exit}' | xargs)
          
          if [ -z "$SCHEME" ]; then
            echo "❌ Error: Could not detect any schemes!"
            echo "Full list output:"
            xcodebuild -list $TARGET_FLAG "$TARGET_NAME"
            exit 1
          fi
          
          echo "✅ Detected Scheme: $SCHEME"
          
          # 3. 输出变量供后续步骤使用
          echo "work_dir=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "target_name=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "target_flag=$TARGET_FLAG" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build Archive (Unsigned)
        run: |
          cd "${{ steps.setup_build.outputs.work_dir }}"
          
          echo "🚀 Building Scheme: ${{ steps.setup_build.outputs.scheme }}"
          
          mkdir -p build_output

          xcodebuild clean archive \
            -scheme "${{ steps.setup_build.outputs.scheme }}" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            -sdk iphoneos \
            "${{ steps.setup_build.outputs.target_flag }}" "${{ steps.setup_build.outputs.target_name }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cd "${{ steps.setup_build.outputs.work_dir }}"
          
          mkdir -p Payload
          # 查找生成的 .app (文件名可能随 Scheme 变化，所以用通配符)
          APP_PATH=$(find build_output/App.xcarchive -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: .app file not found!"
            exit 1
          fi
          
          echo "📦 Packaging $(basename "$APP_PATH") into IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r VoidLink.ipa Payload
          
          mv VoidLink.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: VoidLink.ipa
          retention-days: 5
